<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfumería</title>
  <meta name="description" content="Catálogo de perfumes y plataforma para vendedores">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <span class="brand-mark">◇</span>
      <span class="brand-name">PERFUMERÍA</span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
    <nav class="nav" id="nav"></nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="line"></div>
    <p>© <span id="year"></span> Perfumería · Fragancias originales</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
