<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Distinto SCZ</title>
  <meta name="description" content="Distinto SCZ · Tu fragancia, tu sello. Catálogo de perfumes y plataforma para vendedores.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <img src="img/emblem.png" alt="" class="intro-emblem">
    <div class="intro-name">DISTINTO SCZ</div>
    <div class="intro-tag">Tu fragancia, tu sello</div>
  </div>

  <div class="scroll-progress" id="scrollProgress"></div>

  <header class="topbar" id="topbar">
    <a href="#/" class="brand" aria-label="Distinto SCZ, inicio">
      <img src="img/emblem.png" alt="" class="brand-emblem">
      <span class="brand-text">
        <span class="brand-name">DISTINTO SCZ</span>
        <span class="brand-tag">Tu fragancia, tu sello</span>
      </span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
    <nav class="nav" id="nav"></nav>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="line"></div>
    <img src="img/emblem.png" alt="" class="footer-emblem">
    <div class="footer-name">DISTINTO SCZ</div>
    <div class="footer-tag">Tu fragancia, tu sello</div>
    <p>© <span id="year"></span> Distinto SCZ · Santa Cruz · <span title="Versión de la página">v15</span></p>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
