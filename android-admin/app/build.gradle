plugins {
    id 'com.android.application'
}

// La llave de firma NO está en el repositorio (es público).
// Se pasa al compilar: ver README.md (keystore.properties fuera del repo).
def keyProps = new Properties()
def keyFile = file(System.getenv('DISTINTO_KEYSTORE_PROPS') ?: 'keystore.properties')
if (keyFile.exists()) keyFile.withInputStream { keyProps.load(it) }

android {
    namespace 'shop.distintoscz.admin'
    compileSdk 36

    defaultConfig {
        applicationId 'shop.distintoscz.admin'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (keyProps['storeFile']) {
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
