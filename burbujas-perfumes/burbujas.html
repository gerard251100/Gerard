<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burbujas Perfumes</title>
<style>
  :root { --chroma: #00ff00; }
  html, body { margin: 0; height: 100%; background: var(--chroma); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; background: var(--chroma); }
  #replay { position: fixed; right: 16px; bottom: 16px; font: 600 14px system-ui, sans-serif;
            padding: 10px 16px; border: 0; border-radius: 8px; background: #000a; color: #fff; cursor: pointer; }
  body.render #replay { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<button id="replay">Repetir</button>
<script>
// Linea de tiempo (segundos)
const APPEAR = 0.9;      // las burbujas aparecen
const BURST = 10.0;      // explotan a los 10 s
const DURATION = 12.0;   // duracion total del clip
const CHROMA = '#00ff00';

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// Fotos opcionales: si existen img/megamare.png y img/atlas.png (fondo transparente) se usan en vez del dibujo
const photos = {};
function loadPhoto(key, src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { photos[key] = im; res(); };
    im.onerror = () => res();
    im.src = src;
  });
}

// Aleatorio con semilla para que cada render sea identico
function rng(seed) {
  return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

// ---------- Botellas (ilustracion estilizada) ----------
function drawMegamare() {
  // Tapa negra robusta
  let g = ctx.createLinearGradient(-78, 0, 78, 0);
  g.addColorStop(0, '#050505'); g.addColorStop(0.35, '#3b3b3b'); g.addColorStop(0.55, '#1a1a1a'); g.addColorStop(1, '#030303');
  ctx.fillStyle = g; rrect(-78, -235, 156, 150, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 2;
  for (let y = -220; y < -95; y += 9) { ctx.beginPath(); ctx.moveTo(-70, y); ctx.lineTo(70, y); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; rrect(-52, -228, 14, 136, 7); ctx.fill();
  // Cuello metalico
  g = ctx.createLinearGradient(-34, 0, 34, 0);
  g.addColorStop(0, '#6b5a2e'); g.addColorStop(0.5, '#e8d38f'); g.addColorStop(1, '#5a4a22');
  ctx.fillStyle = g; ctx.fillRect(-34, -88, 68, 26);
  // Cuerpo de vidrio azul petroleo profundo
  g = ctx.createLinearGradient(-125, 0, 125, 0);
  g.addColorStop(0, '#04202c'); g.addColorStop(0.3, '#0d5468'); g.addColorStop(0.55, '#127089'); g.addColorStop(1, '#031a24');
  ctx.fillStyle = g; rrect(-125, -64, 250, 240, 46); ctx.fill();
  // Base gruesa de vidrio
  g = ctx.createLinearGradient(0, 130, 0, 176);
  g.addColorStop(0, 'rgba(120,210,235,0.0)'); g.addColorStop(1, 'rgba(150,225,245,0.45)');
  ctx.fillStyle = g; rrect(-125, 128, 250, 48, [0, 0, 46, 46]); ctx.fill();
  // Contorno y reflejos
  ctx.strokeStyle = 'rgba(170,230,250,0.45)'; ctx.lineWidth = 3; rrect(-125, -64, 250, 240, 46); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; rrect(-102, -46, 16, 190, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; rrect(82, -40, 10, 170, 5); ctx.fill();
  // Textos
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e9d9a6';
  ctx.font = '600 13px "DejaVu Sans", sans-serif'; ctx.letterSpacing = '4px';
  ctx.fillText('ORTO PARISI', 3, 20);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.font = '700 27px "DejaVu Serif", serif'; ctx.letterSpacing = '2px';
  ctx.fillText('MEGAMARE', 3, 64);
  ctx.letterSpacing = '0px';
}

function drawAtlas() {
  // Tapa plateada con estrias
  let g = ctx.createLinearGradient(-58, 0, 58, 0);
  g.addColorStop(0, '#6d7480'); g.addColorStop(0.3, '#f4f7fb'); g.addColorStop(0.55, '#a9b1bd'); g.addColorStop(1, '#4b525d');
  ctx.fillStyle = g; rrect(-58, -235, 116, 128, 12); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
  for (let x = -50; x <= 50; x += 10) { ctx.beginPath(); ctx.moveTo(x, -228); ctx.lineTo(x, -114); ctx.stroke(); }
  // Aro dorado
  g = ctx.createLinearGradient(-62, 0, 62, 0);
  g.addColorStop(0, '#7a5a1c'); g.addColorStop(0.5, '#f6dc8c'); g.addColorStop(1, '#6a4c14');
  ctx.fillStyle = g; rrect(-62, -112, 124, 22, 6); ctx.fill();
  // Cuerpo azul degradado
  g = ctx.createLinearGradient(0, -90, 0, 210);
  g.addColorStop(0, '#bfe4ff'); g.addColorStop(0.45, '#4f9cf0'); g.addColorStop(1, '#13358f');
  ctx.fillStyle = g; rrect(-96, -90, 192, 300, 20); ctx.fill();
  // Volumen lateral
  g = ctx.createLinearGradient(-96, 0, 96, 0);
  g.addColorStop(0, 'rgba(0,10,50,0.45)'); g.addColorStop(0.25, 'rgba(255,255,255,0)'); g.addColorStop(0.8, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,10,50,0.5)');
  ctx.fillStyle = g; rrect(-96, -90, 192, 300, 20); ctx.fill();
  ctx.strokeStyle = 'rgba(220,240,255,0.6)'; ctx.lineWidth = 3; rrect(-96, -90, 192, 300, 20); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; rrect(-78, -76, 12, 270, 6); ctx.fill();
  // Placa dorada con nombre
  g = ctx.createLinearGradient(-70, 0, 70, 0);
  g.addColorStop(0, '#8a6620'); g.addColorStop(0.5, '#f7e09a'); g.addColorStop(1, '#7a5818');
  ctx.strokeStyle = g; ctx.lineWidth = 2; rrect(-72, 30, 144, 76, 6); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = g;
  ctx.font = '700 30px "DejaVu Serif", serif'; ctx.letterSpacing = '4px';
  ctx.fillText('ATLAS', 2, 60);
  ctx.font = '600 13px "DejaVu Sans", sans-serif'; ctx.letterSpacing = '6px';
  ctx.fillStyle = '#f7e09a';
  ctx.fillText('LATTAFA', 4, 92);
  ctx.letterSpacing = '0px';
}

function drawBottle(b) {
  const im = photos[b.key];
  if (im) {
    const s = Math.min(420 / im.width, 460 / im.height);
    ctx.drawImage(im, -im.width * s / 2, -im.height * s / 2, im.width * s, im.height * s);
  } else {
    b.draw();
  }
}

// ---------- Burbuja de cristal ----------
function drawBubble(r, t) {
  // Interior casi transparente con borde luminoso
  let g = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.8, 'rgba(225,240,255,0.07)');
  g.addColorStop(0.95, 'rgba(235,245,255,0.28)');
  g.addColorStop(1, 'rgba(255,255,255,0.55)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  // Pelicula iridiscente que gira
  const cg = ctx.createConicGradient(t * 0.6, 0, 0);
  const cols = ['rgba(255,90,210,0.5)', 'rgba(90,170,255,0.5)', 'rgba(255,235,120,0.4)', 'rgba(170,100,255,0.5)', 'rgba(255,140,90,0.4)', 'rgba(255,90,210,0.5)'];
  cols.forEach((c, i) => cg.addColorStop(i / (cols.length - 1), c));
  ctx.save();
    ctx.strokeStyle = cg; ctx.lineWidth = r * 0.07;
  ctx.filter = `blur(${r * 0.02}px)`;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.955, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // Aro fino exterior
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, r - 1, 0, Math.PI * 2); ctx.stroke();

  // Brillo principal (media luna arriba a la izquierda)
  ctx.save();
  ctx.filter = `blur(${r * 0.012}px)`;
  g = ctx.createLinearGradient(-r * 0.7, -r * 0.7, -r * 0.2, -r * 0.2);
  g.addColorStop(0, 'rgba(255,255,255,0.85)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.88, Math.PI * 1.05, Math.PI * 1.45);
  ctx.arc(r * 0.08, r * 0.08, r * 0.8, Math.PI * 1.45, Math.PI * 1.05, true);
  ctx.closePath(); ctx.fill();
  // Destello puntual
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.ellipse(-r * 0.36, -r * 0.62, r * 0.07, r * 0.035, -0.6, 0, Math.PI * 2); ctx.fill();
  // Reflejo inferior derecho
  g = ctx.createLinearGradient(r * 0.4, r * 0.4, r * 0.75, r * 0.75);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,0.45)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.93, Math.PI * 0.12, Math.PI * 0.38);
  ctx.arc(-r * 0.04, -r * 0.04, r * 0.88, Math.PI * 0.38, Math.PI * 0.12, true);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ---------- Explosion ----------
function makeBurst(seed, r) {
  const rand = rng(seed);
  const drops = [], shards = [];
  for (let i = 0; i < 70; i++) {
    const a = rand() * Math.PI * 2;
    const sp = 350 + rand() * 750;
    drops.push({ a, sp, r0: r * (0.85 + rand() * 0.15), size: 2 + rand() * 6, life: 0.5 + rand() * 0.6 });
  }
  for (let i = 0; i < 16; i++) {
    const a = rand() * Math.PI * 2;
    shards.push({ a, len: 0.15 + rand() * 0.3, sp: 250 + rand() * 450, spin: (rand() - 0.5) * 6, hue: Math.floor(rand() * 360) });
  }
  return { drops, shards };
}

function drawBurst(burst, r, dt) {
  // Destello y onda expansiva
  if (dt < 0.25) {
    const k = dt / 0.25;
    ctx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - k)})`;
    ctx.lineWidth = 10 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(0, 0, r * (1 + 0.15 * easeOutCubic(k)), 0, Math.PI * 2); ctx.stroke();
  }
  // Fragmentos de pelicula iridiscente
  for (const s of burst.shards) {
    const k = dt / 0.7; if (k >= 1) continue;
    const d = r * 0.95 + s.sp * dt;
    ctx.save();
    ctx.rotate(s.a + s.spin * dt * 0.2);
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = `hsla(${s.hue},100%,80%,0.9)`;
    ctx.lineWidth = 4 * (1 - k) + 1;
    ctx.beginPath(); ctx.arc(0, 0, d, -s.len / 2, s.len / 2); ctx.stroke();
    ctx.restore();
  }
  // Gotitas con gravedad
  for (const p of burst.drops) {
    if (dt > p.life) continue;
    const k = dt / p.life;
    const x = Math.cos(p.a) * (p.r0 + p.sp * dt);
    const y = Math.sin(p.a) * (p.r0 + p.sp * dt) + 900 * dt * dt;
    const s = p.size * (1 - k * 0.6);
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = 'rgba(235,248,255,0.95)';
    ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,1)';
    ctx.beginPath(); ctx.arc(x - s * 0.3, y - s * 0.3, s * 0.35, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- Escena ----------
const R = 330;
const bubbles = [
  { key: 'megamare', x: 520,  y: 540, phase: 0.0, draw: drawMegamare, burst: makeBurst(11, R) },
  { key: 'atlas',    x: 1400, y: 540, phase: 1.7, draw: drawAtlas,    burst: makeBurst(29, R) },
];

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = CHROMA; ctx.fillRect(0, 0, W, H);

  for (const b of bubbles) {
    const appear = clamp(t / APPEAR, 0, 1);
    const grow = appear > 0 ? easeOutBack(appear) : 0;
    const bob = Math.sin(t * 1.3 + b.phase) * 16;
    const sway = Math.sin(t * 0.8 + b.phase) * 8;
    const cx = b.x + sway, cy = b.y + bob;
    const dt = t - BURST;

    // Perfume: entra con la burbuja; al explotar da un pequeno rebote y se queda
    ctx.save();
    ctx.translate(cx, cy);
    let ps = 0.85 * grow;
    if (dt > 0) ps = 0.85 * (1 + 0.07 * Math.sin(clamp(dt / 0.45, 0, 1) * Math.PI));
    ctx.globalAlpha = clamp(appear * 1.5, 0, 1);
    ctx.rotate(Math.sin(t * 0.9 + b.phase) * 0.035);
    ctx.scale(ps, ps);
    drawBottle(b);
    ctx.restore();
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(cx, cy);
    if (dt < 0) {
      // Burbuja intacta con leve deformacion elastica
      const wob = 0.012 * Math.sin(t * 3.1 + b.phase);
      const pre = clamp((dt + 0.12) / 0.12, 0, 1); // se hincha justo antes de reventar
      const s = grow * (1 + 0.06 * pre);
      ctx.scale(s * (1 + wob), s * (1 - wob));
      if (grow > 0.01) drawBubble(R, t + b.phase);
    } else {
      drawBurst(b.burst, R * 1.06, dt);
    }
    ctx.restore();
  }
}

window.renderFrame = renderFrame;
window.DURATION = DURATION;
window.ready = Promise.all([loadPhoto('megamare', 'img/megamare.png'), loadPhoto('atlas', 'img/atlas.png')]);

if (location.search.includes('render')) {
  document.body.classList.add('render');
} else {
  let start;
  const loop = now => {
    if (start === undefined) start = now;
    renderFrame(Math.min((now - start) / 1000, DURATION));
    requestAnimationFrame(loop);
  };
  window.ready.then(() => requestAnimationFrame(loop));
  document.getElementById('replay').onclick = () => { start = undefined; };
}
</script>
</body>
</html>
